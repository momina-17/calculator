<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
    <input id="input" placeholder="0">
    <div>
    <button class="button color" id="AC" button="AC">AC</button>
    <button class="button color" id="DEL" button="DEL">DEL</button>
    <button class="button color" id="MOD" button="%">%</button>
    <button class="button color" id="DIV" button="/">/</button>
    </div>
    <div>
    <button class="button" id="7">7</button>
    <button class="button" id="8">8</button>
    <button class="button" id="9">9</button>
    <button class="button color" id="MUL">*</button>
    </div>
    <div>
    <button class="button" id="4">4</button>
    <button class="button" id="5">5</button>
    <button class="button" id="6">6</button>
    <button class="button color" id="SUB">-</button>
    </div>
    <div>
    <button class="button" id="1">1</button>
    <button class="button" id="2">2</button>
    <button class="button" id="3">3</button>
    <button class="button color" id="ADD">+</button>
    </div>
    <div>
    <button class="button" id="00">00</button>
    <button class="button" id="0">0</button>
    <button class="button" id="DOT">.</button>
    <button class="button " id="Equal">=</button>
    </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
